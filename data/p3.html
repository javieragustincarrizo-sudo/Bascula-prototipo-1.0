<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Báscula - Panel de Control</title>
   <!-- Vínculos oficiales de Bootstrap -->
   <link rel="stylesheet" href="/assets/bootstrap.min.css">
   <link rel="stylesheet" href="/assets/style.css">
   <link rel="icon" type="image/x-icon" href="/assets/balanza.png">
</head>
<body class="bg-light">

   <!-- Contenedor Principal Completo de la Aplicación -->
   <div class="container-fluid p-0">
       <div class="row g-0 min-vh-100">
           
           <!-- MENÚ LATERAL (Antes aside): Estructurado con columnas de Bootstrap -->
           <div class="col-12 col-md-3 col-xl-2 bg-white border-end p-3">
               <div class="nav nav-pills flex-column gap-1">
                   <a href="/index.html" class="nav-link active">
                       <i class="bi bi-speedometer2 me-2"></i> Panel
                   </a>
                   <a href="/configuracion.html" onclick="verificarAccesoConfig()" class="nav-link text-dark">
                       <i class="bi bi-wifi me-2"></i> Configuración
                   </a>
               </div>
           </div>

           <!-- CONTENEDOR DE CONTENIDO (Columna derecha) -->
           <div class="col-12 col-md-9 col-xl-10 d-flex flex-column">
               
               <!-- BARRA SUPERIOR (Antes header): Panel de estado de red y batería -->
               <div class="navbar navbar-light bg-white shadow-sm px-4 py-2">
                   <div class="container-fluid d-flex justify-content-end align-items-center gap-4">
                       
                       <!-- Información de Modo de Operación -->
                       <div class="text-end small fw-bold lh-sm">
                           <div>Modo: <span id="modo" class="text-primary">Maestro</span></div>
                           <div id="info-red-header" class="text-muted fs-7" style="font-size: 0.75rem;">
                               Conectado a: <span id="red-nombre">--</span> (<span id="ip-header" class="font-monospace text-primary">0.0.0.0</span>)
                           </div>
                       </div>

                       <!-- Widget de Batería Digital -->
                       <div class="d-flex align-items-center" id="bateria-widget" title="Batería del dispositivo">
                           <span id="bateria-porcentaje" class="small fw-bold me-2">--%</span>
                           <div id="bateria-icono" class="position-relative d-flex align-items-center border border-secondary rounded p-1 gap-1" style="width: 35px; height: 20px;">
                               <div id="bat-bar-1" class="bg-light flex-fill h-100"></div>
                               <div id="bat-bar-2" class="bg-light flex-fill h-100"></div>
                               <div id="bat-bar-3" class="bg-light flex-fill h-100"></div>
                               <div id="bat-bar-4" class="bg-light flex-fill h-100"></div>
                               <div id="bat-bar-5" class="bg-light flex-fill h-100"></div>
                               <div class="position-absolute bg-secondary top-50 translate-middle-y rounded-end" style="right: -4px; width: 3px; height: 8px;"></div>
                           </div>
                       </div>

                       <!-- Widget de Intensidad de Señal Wi-Fi -->
                       <div class="d-flex align-items-center" title="Intensidad de Señal Wi-Fi">
                           <div id="signal-bars" class="d-flex align-items-end gap-1 me-2" style="height: 16px;">
                               <div id="wifi-bar-1" class="bg-secondary rounded-top" style="width: 3px; height: 25%;"></div>
                               <div id="wifi-bar-2" class="bg-secondary rounded-top" style="width: 3px; height: 50%;"></div>
                               <div id="wifi-bar-3" class="bg-secondary rounded-top" style="width: 3px; height: 75%;"></div>
                               <div id="wifi-bar-4" class="bg-secondary rounded-top" style="width: 3px; height: 100%;"></div>
                           </div>
                           <span id="wifi-texto-rssi" class="small fw-bold text-muted">Señal</span>
                       </div>

                       <!-- Estado General del Sistema -->
                       <span id="sistema" class="badge rounded-pill bg-secondary px-3 py-2">Estado</span>
                   </div>
               </div>

               <!-- CUERPO CENTRAL DE MONITOREO (Antes main) -->
               <div class="p-4 flex-fill">
                   
                   <!-- Encabezado de la Sección -->
                   <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-4 border-bottom">
                       <h1 class="h2 text-dark m-0">Monitoreo de Red de Pesaje</h1>
                       <span class="badge bg-secondary p-2" id="indicador-rol">Rol: Cargando...</span>
                   </div>

                   <!-- Bloque de Peso Total e Indicadores Globales -->
                   <div class="row mb-4">
                       <div class="col-12">
                           <div class="card border-0 bg-white p-4 shadow-sm">
                               <div class="row align-items-center">
                                   <!-- Panel de Lectura Numérica -->
                                   <div class="col-md-6 text-center text-md-start">
                                       <h5 class="text-muted text-uppercase fw-bold small m-0">PESO TOTAL DE LA RED</h5>
                                       <div class="text-danger my-2 display-1 fw-bolder">
                                           <span id="peso-total-red">0.00</span><span class="text-muted fs-2 ms-2 fw-normal">kg</span>
                                       </div>
                                       <small class="text-muted">Básculas activas en red: <span id="total-dispositivos" class="fw-bold text-dark">1</span></small>
                                   </div>
                                   
                                   <!-- Botones de Control de Planta -->
                                   <div class="col-md-6 mt-3 mt-md-0">
                                       <div class="d-flex flex-column gap-2">
                                           <button onclick="ejecutarTaraGeneralWeb()" class="btn btn-danger w-100 fw-bold py-3 shadow-sm">
                                               <i class="bi bi-arrow-counterclockwise me-2"></i> TARA GENERAL (RED)
                                           </button>
                                           <button onclick="ejecutarCeroGeneralWeb()" class="btn btn-dark w-100 fw-bold py-3 shadow-sm">
                                               <i class="bi bi-dash-circle"></i> PUESTA A CERO GLOBAL
                                           </button>
                                       </div>
                                   </div>
                               </div>
                           </div>
                       </div>
                   </div>

                   <!-- Panel de Celdas de Carga Activas -->
                   <div class="row mb-4">
                       <div class="col-12 d-flex justify-content-between align-items-center mb-3">
                           <h4 class="fw-bold text-secondary m-0">Dispositivos y Celdas de Carga</h4>
                           <!-- Botón de Vinculación de Hardware (Solo Administradores) -->
                           <button id="btn-adjuntar-dispositivo" class="btn btn-outline-success btn-sm style-admin-only" style="display: none;" data-bs-toggle="modal" data-bs-target="#modalAgregarEsclavo">
                               <i class="bi bi-plus-circle me-1"></i> Adjuntar Dispositivo
                           </button>
                       </div>

                       <!-- Grilla de Dispositivos (Administrada Dinámicamente por script.js) -->
                       <div class="col-12">
                           <div class="row g-3" id="contenedor-todas-las-basculas">
                               <!-- Las tarjetas de celdas individuales se inyectan aquí -->
                           </div>
                       </div>
                   </div>

                   <!-- Bitácora de Alarmas y Sobrecargas (Solo Administradores) -->
                   <div id="panel-historial-alertas" class="row style-admin-only" style="display: none;">
                       <div class="col-12">
                           <div class="card border-warning shadow-sm bg-white">
                               <div class="card-header bg-warning text-dark fw-bold d-flex justify-content-between align-items-center py-2">
                                      <span><i class="bi bi-exclamation-triangle-fill me-2"></i> Historial de Alarmas y Sobrecargas</span>
                                      <button id="btn-limpiar-historial" class="btn btn-sm btn-outline-dark">
                                        <i class="bi bi-trash me-1"></i> Limpiar Historial
                                      </button>
                                 </div>
                                 <div class="card-body p-3" style="max-height: 300px; overflow-y: auto;">
                                      <ul id="lista-historial-alertas" class="list-group list-group-flush small">
                                        <!-- Los eventos de alarma se inyectan aquí -->
                                      </ul>
                                    </div>
                            </div>
                        </div>
                    </div>
