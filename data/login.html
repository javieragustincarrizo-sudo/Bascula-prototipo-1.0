<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Báscula - Acceso Administrador</title>
	<link rel="stylesheet" href="/assets/bootstrap.min.css">
	<style>
		body { height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f8f9fa; }
		.card-login { width: 100%; max-width: 400px; padding: 20px; border-radius: 10px; }
	</style>
</head>
<body>
	<div class="card card-login bg-white shadow-sm">
		<div class="text-center mb-4">
			<h4 class="font-weight-bold text-secondary">Acceso de Seguridad</h4>
			<p class="text-muted small">Por favor ingresa las credenciales de Administrador</p>
		</div>
		<form id="form-login" onsubmit="procesarLogin(event)">
			<div class="form-group mb-3">
				<label class="small font-weight-bold text-muted">Usuario</label>
				<input type="text" id="user" class="form-control form-control-lg" required autocomplete="username">
			</div>
			<div class="form-group mb-4">
				<label class="small font-weight-bold text-muted">Contraseña</label>
				<input type="password" id="pass" class="form-control form-control-lg" required autocomplete="current-password">
			</div>
			<div id="alert-error" class="alert alert-danger small p-2" style="display: none;">Credenciales incorrectas</div>
			<button type="submit" class="btn btn-primary btn-block font-weight-bold w-100 py-2">Iniciar Sesión</button>
			<a href="/index.html" class="btn btn-link btn-block w-100 text-muted small mt-2">Volver al Panel</a>
		</form>
	</div>

	<script>
		function procesarLogin(e) {
			e.preventDefault();
			const u = document.getElementById('user').value;
			const p = document.getElementById('pass').value;
			
 // Valores hardcodeados por defecto (puedes cambiarlos aquí o acoplarlos a un API del ESP32)
			if(u === "admin" && p === "1234") {
				localStorage.setItem("bascula_is_admin", "true");
				window.location.href = "/index.html";
			} else {
				document.getElementById('alert-error').style.display = "block";
			}
		}
	</script>
</body>
</html>
